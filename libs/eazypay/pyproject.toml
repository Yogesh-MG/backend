[tool.poetry]
name = "sdk-multi-client-python"
version = "0.1.0"
description = ""
authors = ["Venu Mallik <vbellamkonda@innominds.com>"]
readme = "README.md"

packages = [
    { include = "src/corporate/*",  to = "corporate" },
    { include = "src/composite/*",  to = "composite" },
    { include = "src/eazypay/*",  to = "eazypay" },
    { include = "src/httpcore/*",  to = "httpcore" },
]

[tool.poetry.dependencies]
python = "^3.9.16"
pydantic = "^2.10.4"
ruff = "^0.9.0"
cryptography = "^44.0.0"
setuptools = "^75.8.0"
pydantic-settings = "^2.7.1"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
pip = "^25.0.1"


[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta" 

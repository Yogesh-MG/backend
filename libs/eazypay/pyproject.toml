[tool.poetry]
name = "sdk-multi-client-python"
version = "0.1.0"
description = ""
authors = ["Venu Mallik <vbellamkonda@innominds.com>"]
readme = "README.md"

packages = [
    { include = "src/eazypay/*",  to = "eazypay" },
    { include = "src/eazypay_httpcore/*",  to = "eazypay_httpcore" },
]

[tool.poetry.dependencies]
python = "^3.9.16"
pydantic = "^2.10.4"
ruff = "^0.9.0"
cryptography = "^44.0.0"
setuptools = "^75.8.0"
pydantic-settings = "^2.7.1"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
pip = "^25.0.1"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 
